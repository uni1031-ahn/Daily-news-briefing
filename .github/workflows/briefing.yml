name: daily-news-briefing

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      send_mail:
        description: "브리핑 메일을 실제로 발송 (끄면 저장만 하고 발송 안 함)"
        type: boolean
        default: false

permissions:
  contents: write   # data/ 폴더에 누적 저장 결과를 커밋하기 위해 필요
  issues: write

concurrency:
  group: daily-news-briefing
  cancel-in-progress: false   # 동시에 두 번 실행돼 커밋이 충돌하는 것을 방지

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python news_briefing.py
        env:
          # 정기 실행(schedule)은 항상 발송, 수동 실행은 체크했을 때만 발송
          SEND_MAIL: ${{ (github.event_name == 'schedule' || inputs.send_mail) && '1' || '0' }}
          TOP_N: "30"
          HOURS: "24"
          GITHUB_ISSUE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 2차 수집(네이버 뉴스 검색). 키가 없으면 2차만 건너뛰고 1차 브리핑은 정상 발송
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 포털(보험 인사이트 포털)로 오늘 기사 보내기. 값이 없으면 건너뜁니다
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: 누적 데이터 저장 (data/ 커밋)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "저장할 변경 없음"
          else
            git commit -m "archive: $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash
            git push
          fi

      - name: 결과 화면 보관 (테스트 확인용)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: briefing-html
          path: briefing.html
