name: oncology-weekly

on:
  schedule:
    - cron: "0 23 * * 0"      # 일요일 23:00 UTC = 월요일 08:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oncology-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 항암 주간 요약 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python oncology_weekly.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/oncology
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "oncology weekly $(date -u +%G-W%V)"
          git pull --rebase
          git push
